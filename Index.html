<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 { color: #ff4d6d; }

    button {
      padding: 12px 25px;
      margin: 15px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ccc;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="box" id="box">
    <h1>Navyaa 💕</h1>
    <h2 id="question">Will you be my Valentine?</h2>
    <button id="yes" onclick="yesClick()">Yes ❤️</button>
    <button id="no" onmouseover="moveNo()">No 😜</button>
  </div>

  <script>
    let moves = 0;
    const maxMoves = 18;

    function moveNo() {
      if (moves >= maxMoves) return;
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      const noBtn = document.getElementById("no");
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      moves++;
    }

    let yesStage = 0;

    function yesClick() {
      const question = document.getElementById("question");

      if (yesStage === 0) {
        question.innerText = "Are you REALLY sure? 🤨";
        yesStage++;
      } 
      else if (yesStage === 1) {
        question.innerText = "Like… 100% sure? 😏";
        yesStage++;
      } 
      else if (yesStage === 2) {
        question.innerText = "Last chance to escape 😈";
        yesStage++;
      } 
      else {
        document.body.innerHTML = `
          <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            flex-direction:column;
            background:linear-gradient(135deg,#ff9a9e,#fad0c4);
            font-family:Arial;
          ">
            <h1 style="color:white;">SHE SAID YESSS 😍💖</h1>
            <h2 style="color:white;">Navyaa is officially my Valentine ❤️</h2>
            <p style="color:white;font-size:20px;">
              No refunds. No returns. Only love 😌✨
            </p>
          </div>
        `;
      }
    }
  </script>

</body>
</html>
