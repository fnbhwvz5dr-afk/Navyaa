<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1b1f3b, #090a15);
  overflow: hidden;
  color: white;
}

/* CENTER CARD */
.card {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 380px;
  padding: 32px 24px;
  border-radius: 26px;
  text-align: center;
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  box-shadow:
    0 0 25px rgba(255,77,109,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.2);
  z-index: 10;
  pointer-events: none; /* IMPORTANT: never block buttons */
}

h1 {
  color: #ff6b8b;
  font-size: 26px;
  margin-bottom: 10px;
}

p {
  font-size: 18px;
  min-height: 52px;
}

/* FULL-SCREEN BUTTON AREA */
.playground {
  position: fixed;
  inset: 0;
  z-index: 20; /* ABOVE card */
}

/* BUTTONS */
button {
  position: absolute;
  width: 120px;
  height: 48px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: left 0.35s ease, top 0.35s ease;
  z-index: 30; /* ALWAYS ON TOP */
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
  color: white;
}

#no {
  background: rgba(255,255,255,0.22);
  color: white;
}

/* FLOATING DECOR */
.float {
  position: fixed;
  pointer-events: none;
  animation: floatUp linear forwards;
  z-index: 1;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_5e2b2a9bda.mp3">
</audio>

<div class="card">
  <h1>Navyaa 💕</h1>
  <p id="question">Will you be my Valentine?</p>
</div>

<div class="playground" id="playground">
  <button id="yes">Yes ❤️</button>
  <button id="no">No 🙈</button>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const question = document.getElementById("question");
const music = document.getElementById("bgMusic");

/* Start music safely */
document.addEventListener("click", () => {
  music.volume = 0.4;
  music.play();
}, { once: true });

let yesCount = 0;
let noCount = 0;

/* TEXTS */
const yesTease = [
  "Sooch lo 🤨",
  "Mujhse pyaar karti ho tabhi click karna 😌",
  "Accha… karti ho kya Navuu? 👀",
  "Itna desperate ho rahi hai ladki YES bolne ke liye 😂"
];

const yesConfirm = [
  "Are you REALLY sure? 🤨",
  "100% sure? 😏",
  "Last chance 👀"
];

const noTease = [
  "Dhokha hua hai 💔 seedha NO pe click kar rahi",
  "Phir kar rahi hai… 😑",
  "Beshram 😭"
];

/* SAFE RANDOM POSITION (NO OVERLAP, FULL SCREEN) */
function moveButton(btn, otherBtn) {
  const padding = 20;
  const btnW = btn.offsetWidth;
  const btnH = btn.offsetHeight;

  let x, y, safe;

  do {
    x = Math.random() * (window.innerWidth - btnW - padding * 2) + padding;
    y = Math.random() * (window.innerHeight - btnH - padding * 2) + padding;

    const dx = x - otherBtn.offsetLeft;
    const dy = y - otherBtn.offsetTop;
    const distance = Math.sqrt(dx * dx + dy * dy);

    safe = distance > 160;
  } while (!safe);

  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

/* INITIAL PERFECT ALIGNMENT */
function centerButtons() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2 + 140;

  yesBtn.style.left = (cx - 140) + "px";
  yesBtn.style.top = cy + "px";

  noBtn.style.left = (cx + 20) + "px";
  noBtn.style.top = cy + "px";
}

centerButtons();
window.addEventListener("resize", centerButtons);

/* NO BUTTON */
noBtn.addEventListener("click", () => {
  moveButton(noBtn, yesBtn);
  if (noCount < noTease.length) {
    question.innerText = noTease[noCount];
    noCount++;
  }
});

/* YES BUTTON */
yesBtn.addEventListener("click", () => {

  if (yesCount < yesTease.length) {
    moveButton(yesBtn, noBtn);
    question.innerText = yesTease[yesCount];
    yesCount++;
    return;
  }

  const confirmIndex = yesCount - yesTease.length;
  if (confirmIndex < yesConfirm.length) {
    moveButton(yesBtn, noBtn);
    question.innerText = yesConfirm[confirmIndex];
    yesCount++;
    return;
  }

  /* FINAL SCREEN */
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:radial-gradient(circle at top,#1b1f3b,#090a15);
      color:white;
      font-family:Poppins;
      text-align:center;
      padding:20px;
    ">
      <h1 style="color:#ff8fa3;font-size:40px;">She said YES 😭❤️</h1>
      <p style="font-size:22px;margin-top:8px;">
        Ese hi puchna tha kya darling 😌💖
      </p>
      <p style="font-size:18px;margin-top:6px;">
        Navyaa is officially my Valentine ✨
      </p>
    </div>
  `;
});

/* FLOATING HEARTS */
setInterval(() => {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "❤" : "✨";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.bottom = "-20px";
  el.style.fontSize = Math.random() * 10 + 14 + "px";
  el.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 7000);
}, 600);
</script>

</body>
</html>
