<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1b1f3b, #090a15);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

/* Glass card */
.card {
  width: 90%;
  max-width: 380px;
  padding: 32px 26px 40px;
  border-radius: 24px;
  text-align: center;
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  box-shadow:
    0 0 25px rgba(255,77,109,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.2);
}

h1 {
  color: #ff6b8b;
  margin-bottom: 10px;
  font-size: 28px;
}

p {
  font-size: 18px;
  margin-bottom: 28px;
  transition: opacity 0.3s ease;
}

/* Buttons container */
.buttons {
  position: relative;
  height: 80px;
}

button {
  padding: 14px 26px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.25s ease;
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
  color: white;
  position: absolute;
  left: 10%;
}

#no {
  background: rgba(255,255,255,0.18);
  color: white;
  position: absolute;
  right: 10%;
}

/* Floating hearts & sparkles */
.float {
  position: absolute;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c8c6a9b7b.mp3">
</audio>

<div class="card">
  <h1>Navyaa 💕</h1>
  <p id="question">Will you be my Valentine?</p>

  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const question = document.getElementById("question");
const music = document.getElementById("bgMusic");

let yesMoves = 0;
let noMoves = 0;
let confirmStage = 0;

const confirmTexts = [
  "Are you REALLY sure? 🤨",
  "100% sure? 😏",
  "Last chance 👀"
];

// Start music on interaction
function startMusic() {
  music.volume = 0.4;
  music.play();
  document.removeEventListener("click", startMusic);
}
document.addEventListener("click", startMusic);

// Move button safely
function move(btn) {
  const area = document.querySelector(".buttons");
  const maxX = area.clientWidth - btn.offsetWidth;
  const x = Math.random() * maxX;
  btn.style.left = x + "px";
}

// NO button runs
noBtn.addEventListener("mouseover", () => {
  if (noMoves < 15) {
    move(noBtn);
    noMoves++;
  }
});

// YES button runs first
yesBtn.addEventListener("mouseover", () => {
  if (yesMoves < 5) {
    move(yesBtn);
    yesBtn.style.transform = yesMoves % 2 ? "scale(0.9)" : "scale(1.1)";
    question.innerText =
      ["Hehe 😜", "Not so fast 😏", "Try again 👀", "Almost there 💕", "Okay… stop 😌"][yesMoves];
    yesMoves++;
  }
});

// YES click confirmations
yesBtn.addEventListener("click", () => {
  if (yesMoves >= 5) {
    if (confirmStage < confirmTexts.length) {
      question.innerText = confirmTexts[confirmStage];
      confirmStage++;
    } else {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
          background:radial-gradient(circle at top,#1b1f3b,#090a15);
          font-family:Poppins;
          text-align:center;
          color:white;
        ">
          <h1 style="color:#ff8fa3;font-size:42px;">She said YES 😭❤️</h1>
          <p style="font-size:20px;">Navyaa is officially my Valentine ✨</p>
        </div>
      `;
    }
  }
});

// Floating hearts & sparkles
setInterval(() => {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "❤" : "✨";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.bottom = "-20px";
  el.style.fontSize = Math.random() * 10 + 14 + "px";
  el.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 7000);
}, 500);
</script>

</body>
</html>
