<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1b1f3b, #090a15);
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
}

.card {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  padding: 40px 30px;
  border-radius: 26px;
  text-align: center;
  width: min(90%, 360px);
  box-shadow:
    0 0 25px rgba(255,77,109,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.2);
}

h1 {
  color: #ff6b8b;
  margin-bottom: 8px;
}

p {
  font-size: 18px;
  margin: 0;
  transition: opacity 0.4s ease;
}

button {
  padding: 14px 26px;
  border-radius: 30px;
  border: none;
  font-size: 17px;
  cursor: pointer;
  position: absolute;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
  color: white;
  box-shadow: 0 0 20px rgba(255,77,109,0.6);
}

#no {
  background: rgba(255,255,255,0.15);
  color: white;
}

.float {
  position: absolute;
  animation: floatUp linear forwards;
  pointer-events: none;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-700px) scale(1.4); opacity: 0; }
}

.fade-out { opacity: 0; }
.fade-in { opacity: 1; }
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c8c6a9b7b.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Navyaa 💕</h1>
  <p id="question" class="fade-in">Will you be my Valentine?</p>
</div>

<button id="yes">Yes ❤️</button>
<button id="no">No 🙈</button>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const question = document.getElementById("question");
const music = document.getElementById("bgMusic");

let yesMoves = 0;
let noMoves = 0;
let confirmStage = 0;
let swapped = false;
let timeoutTriggered = false;

const maxYesMoves = 5;
const maxNoMoves = 20;

const confirmTexts = [
  "Are you REALLY sure? 🤨",
  "100% sure? 😏",
  "Last chance 👀"
];

// Music starts on first interaction
function startMusic() {
  music.volume = 0.4;
  music.play();
  document.removeEventListener("click", startMusic);
  document.removeEventListener("mouseover", startMusic);
}
document.addEventListener("click", startMusic);
document.addEventListener("mouseover", startMusic);

// Smooth text update
function updateText(text) {
  question.classList.add("fade-out");
  setTimeout(() => {
    question.innerText = text;
    question.classList.remove("fade-out");
    question.classList.add("fade-in");
  }, 300);
}

// Move buttons
function move(btn) {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

// Fake timeout heartbreak
setTimeout(() => {
  if (yesMoves < maxYesMoves) {
    updateText("Sorry, you took too long 💔");
    timeoutTriggered = true;
  }
}, 20000);

// NO button
noBtn.addEventListener("mouseover", () => {
  if (noMoves < maxNoMoves) {
    move(noBtn);
    noMoves++;
  }
});

// YES hover behavior
yesBtn.addEventListener("mouseover", () => {
  if (timeoutTriggered) return;

  if (yesMoves < maxYesMoves) {
    move(yesBtn);
    yesMoves++;

    yesBtn.style.transform =
      yesMoves % 2 === 0 ? "scale(0.8)" : "scale(1.2)";

    updateText(
      ["Hehe 😜", "Not so fast 😏", "Try again 👀", "Almost there 💕", "Okay… stop 😌"][yesMoves - 1]
    );

    if (yesMoves === 3 && !swapped) {
      const yesPos = yesBtn.style.cssText;
      yesBtn.style.cssText = noBtn.style.cssText;
      noBtn.style.cssText = yesPos;
      swapped = true;
    }
  }
});

// YES click logic
yesBtn.addEventListener("click", () => {
  if (timeoutTriggered) return;

  if (yesMoves >= maxYesMoves) {
    yesBtn.disabled = true;
    yesBtn.innerText = "Thinking… 🤔";

    let count = 3;
    updateText(`Confirming in ${count}…`);

    const countdown = setInterval(() => {
      count--;
      if (count > 0) {
        updateText(`Confirming in ${count}…`);
      } else {
        clearInterval(countdown);
        yesBtn.disabled = false;
        yesBtn.innerText = "Yes ❤️";

        if (confirmStage < confirmTexts.length) {
          updateText(confirmTexts[confirmStage]);
          confirmStage++;
        } else {
          document.body.innerHTML = `
            <div style="
              height:100vh;
              display:flex;
              justify-content:center;
              align-items:center;
              flex-direction:column;
              background:radial-gradient(circle at top,#1b1f3b,#090a15);
              font-family:Poppins;
              text-align:center;
            ">
              <h1 style="color:#ff8fa3;font-size:46px;">SHE SAID YES 😭❤️🎉</h1>
              <p style="color:white;font-size:22px;">
                Navyaa is officially my Valentine ✨💖
              </p>
            </div>
          `;
        }
      }
    }, 1000);
  }
});

// Floating hearts + sparkles
setInterval(() => {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "❤" : "✨";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.bottom = "-20px";
  el.style.fontSize = Math.random() * 10 + 16 + "px";
  el.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 7000);
}, 400);
</script>

</body>
