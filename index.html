<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1b1f3b, #090a15);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

/* Card */
.card {
  width: 90%;
  max-width: 380px;
  padding: 34px 26px 38px;
  border-radius: 26px;
  text-align: center;
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  box-shadow:
    0 0 25px rgba(255,77,109,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.2);
}

h1 {
  color: #ff6b8b;
  font-size: 28px;
  margin-bottom: 12px;
}

p {
  font-size: 18px;
  margin-bottom: 26px;
  min-height: 26px;
}

/* Pill buttons */
.pill {
  background: rgba(255,255,255,0.15);
  border-radius: 40px;
  padding: 6px;
  display: flex;
  gap: 6px;
}

button {
  flex: 1;
  padding: 14px 0;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.2s ease;
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
  color: white;
}

#no {
  background: transparent;
  color: white;
}

/* Floating hearts & sparkles */
.float {
  position: absolute;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-600px); opacity: 0; }
}

/* Final screen glow */
.final {
  animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
  from {
    box-shadow: 0 0 25px rgba(255,143,163,0.4);
  }
  to {
    box-shadow: 0 0 45px rgba(255,143,163,0.9);
  }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c8c6a9b7b.mp3">
</audio>

<div class="card">
  <h1>Navyaa 💕</h1>
  <p id="question">Will you be my Valentine?</p>

  <div class="pill">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const question = document.getElementById("question");
const music = document.getElementById("bgMusic");

let yesStep = 0;

const steps = [
  "Are you REALLY sure? 🤨",
  "100% sure? 😏",
  "Last chance 👀"
];

// Music (mobile-safe)
document.addEventListener("touchstart", startMusic, { once: true });
document.addEventListener("click", startMusic, { once: true });

function startMusic() {
  music.volume = 0.4;
  music.play();
}

// YES button – stable
yesBtn.addEventListener("click", () => {
  if (yesStep < steps.length) {
    question.innerText = steps[yesStep];
    yesBtn.style.transform = yesStep % 2 ? "scale(0.95)" : "scale(1.05)";
    yesStep++;
  } else {
    document.body.innerHTML = `
      <div class="final" style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:radial-gradient(circle at top,#1b1f3b,#090a15);
        color:white;
        font-family:Poppins;
        text-align:center;
        border-radius:24px;
        padding:30px;
      ">
        <h1 style="color:#ff8fa3;font-size:42px;">She said YES 😭❤️</h1>
        <p style="font-size:20px;">Navyaa is officially my Valentine ✨</p>
      </div>
    `;

    // Gentle confetti (safe)
    setInterval(() => {
      const el = document.createElement("div");
      el.className = "float";
      el.innerText = Math.random() > 0.5 ? "🎉" : "❤";
      el.style.left = Math.random() * window.innerWidth + "px";
      el.style.bottom = "-20px";
      el.style.fontSize = Math.random() * 12 + 16 + "px";
      el.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 7000);
    }, 350);
  }
});

// NO button – always runs
noBtn.addEventListener("click", () => {
  const pill = document.querySelector(".pill");
  const maxX = pill.clientWidth - noBtn.offsetWidth;
  const x = Math.random() * maxX;
  noBtn.style.transform = `translateX(${x}px)`;
});

// Ambient hearts during normal screen
setInterval(() => {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "❤" : "✨";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.bottom = "-20px";
  el.style.fontSize = Math.random() * 10 + 14 + "px";
  el.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 7000);
}, 600);
</script>

</body>
</html>
